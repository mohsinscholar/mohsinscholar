name: Generate Snake Animation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create fast snake with 12 dots
        shell: python
        run: |
          from pathlib import Path

          # Smaller number = faster animation.
          SECONDS = 8
          DOTS = 12
          BODY = 6

          COLS, ROWS = 30, 7
          CELL = 22
          WIDTH = COLS * CELL
          HEIGHT = ROWS * CELL

          # A closed route around the board.
          route = (
              [(x, 1) for x in range(1, 29)]
              + [(28, y) for y in range(2, 6)]
              + [(x, 5) for x in range(27, 0, -1)]
              + [(1, y) for y in range(4, 1, -1)]
          )

          count = len(route)
          food_steps = [
              int((i + 1) * count / (DOTS + 1))
              for i in range(DOTS)
          ]

          out = Path("dist")
          out.mkdir(exist_ok=True)

          themes = [
              (
                  "github-contribution-grid-snake.svg",
                  "#ffffff", "#e5e7eb",
                  "#7c3aed", "#0891b2"
              ),
              (
                  "github-contribution-grid-snake-dark.svg",
                  "#0d1117", "#21262d",
                  "#f472b6", "#22d3ee"
              ),
          ]

          for filename, bg, grid, snake, food in themes:
              styles = []
              parts = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'viewBox="0 0 {WIDTH} {HEIGHT}" '
                  f'role="img" aria-label="Decorative snake animation with 12 dots">',
                  '<title>Fast Snake — 12 Dots</title>',
                  f'<rect width="{WIDTH}" height="{HEIGHT}" '
                  f'rx="12" fill="{bg}"/>',
              ]

              # Background grid.
              for y in range(ROWS):
                  for x in range(COLS):
                      parts.append(
                          f'<rect x="{x*CELL+3}" y="{y*CELL+3}" '
                          f'width="16" height="16" rx="4" '
                          f'fill="{grid}"/>'
                      )

              # Exactly 12 food dots.
              for i, step in enumerate(food_steps):
                  x, y = route[step]
                  eaten = step / count * 100

                  styles.append(
                      f'@keyframes food{i}{{'
                      f'0%{{opacity:1}}'
                      f'{eaten:.5f}%{{opacity:0}}'
                      f'100%{{opacity:0}}'
                      f'}}'
                      f'.food{i}{{animation:food{i} '
                      f'{SECONDS}s steps(1,end) infinite}}'
                  )

                  parts.append(
                      f'<circle class="food{i}" '
                      f'cx="{x*CELL+11}" cy="{y*CELL+11}" '
                      f'r="6" fill="{food}"/>'
                  )

              # Draw tail first, then head.
              for segment in reversed(range(BODY)):
                  frames = []

                  for step in range(count + 1):
                      x, y = route[(step - segment) % count]
                      percent = step / count * 100
                      frames.append(
                          f'{percent:.5f}%{{transform:'
                          f'translate({x*CELL}px,{y*CELL}px)}}'
                      )

                  styles.append(
                      f'@keyframes move{segment}{{'
                      + ''.join(frames)
                      + '}'
                      + f'.snake{segment}{{animation:move{segment} '
                      + f'{SECONDS}s steps(1,end) infinite}}'
                  )

                  opacity = 1 - segment * 0.1
                  parts.append(
                      f'<g class="snake{segment}">'
                      f'<rect x="2" y="2" width="18" height="18" '
                      f'rx="6" fill="{snake}" opacity="{opacity}"/>'
                  )

                  if segment == 0:
                      parts.append(
                          '<circle cx="8" cy="8" r="2" fill="white"/>'
                          '<circle cx="14" cy="8" r="2" fill="white"/>'
                          '<circle cx="8" cy="8" r="1" fill="#111827"/>'
                          '<circle cx="14" cy="8" r="1" fill="#111827"/>'
                      )

                  parts.append('</g>')

              parts.append('<style>' + ''.join(styles) + '</style>')
              parts.append('</svg>')
              (out / filename).write_text(''.join(parts))

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
