name: Generate Snake Animation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate growing snake animation
        shell: python
        run: |
          import random
          from pathlib import Path
          from collections import deque

          W, H = 32, 9
          CELL = 20
          DOTS = 12
          ROUNDS = 6

          # Seconds per move: lower means faster.
          MOVE_TIME = 0.065

          def make_round(seed):
              rng = random.Random(seed)
              snake = [(5, 4), (4, 4), (3, 4), (2, 4)]
              cells = [
                  (x, y)
                  for y in range(H)
                  for x in range(W)
              ]

              food = set(rng.sample(
                  [p for p in cells if p not in snake],
                  DOTS
              ))

              frames = [(snake[:], sorted(food))]

              for _ in range(1200):
                  head = snake[0]
                  blocked = set(snake[:-1])
                  queue = deque([head])
                  previous = {head: None}
                  target = None

                  # Find the nearest reachable dot.
                  while queue:
                      p = queue.popleft()

                      if p in food:
                          target = p
                          break

                      x, y = p
                      neighbors = [
                          (x + 1, y), (x, y + 1),
                          (x - 1, y), (x, y - 1)
                      ]

                      for q in neighbors:
                          if (
                              0 <= q[0] < W
                              and 0 <= q[1] < H
                              and q not in blocked
                              and q not in previous
                          ):
                              previous[q] = p
                              queue.append(q)

                  if target is None:
                      return None

                  nxt = target
                  while previous[nxt] != head:
                      nxt = previous[nxt]

                  snake.insert(0, nxt)

                  if nxt in food:
                      food.remove(nxt)
                  else:
                      snake.pop()

                  frames.append((snake[:], sorted(food)))

                  if not food:
                      return frames

              return None

          frames = []

          for round_number in range(ROUNDS):
              for attempt in range(100):
                  result = make_round(
                      round_number + attempt * 1000
                  )
                  if result:
                      frames.extend(result)
                      break
              else:
                  raise RuntimeError("Could not create round")

          total = len(frames)
          duration = total * MOVE_TIME
          width = W * CELL
          height = H * CELL

          css = [
              ".frame{opacity:0;"
              f"animation-duration:{duration:.4f}s;"
              "animation-timing-function:steps(1,end);"
              "animation-iteration-count:infinite}"
          ]
          groups = []

          for i, (snake, food) in enumerate(frames):
              start = i * 100 / total
              end = (i + 1) * 100 / total

              css.append(
                  f"@keyframes f{i}{{"
                  "0%{opacity:0}"
                  f"{start:.7f}%{{opacity:1}}"
                  f"{end:.7f}%{{opacity:0}}"
                  "100%{opacity:0}"
                  "}"
              )

              group = [
                  f'<g class="frame" '
                  f'style="animation-name:f{i}">'
              ]

              for x, y in food:
                  group.append(
                      f'<circle cx="{x*CELL+10}" '
                      f'cy="{y*CELL+10}" r="5" '
                      'fill="var(--food)"/>'
                  )

              for j in reversed(range(len(snake))):
                  x, y = snake[j]
                  color = (
                      "var(--head)" if j == 0
                      else "var(--body)"
                  )
                  group.append(
                      f'<rect x="{x*CELL+2}" '
                      f'y="{y*CELL+2}" '
                      'width="16" height="16" rx="5" '
                      f'fill="{color}"/>'
                  )

              hx, hy = snake[0]
              for offset in (6, 13):
                  group.append(
                      f'<circle cx="{hx*CELL+offset}" '
                      f'cy="{hy*CELL+6}" r="2" fill="white"/>'
                      f'<circle cx="{hx*CELL+offset}" '
                      f'cy="{hy*CELL+6}" r="1" fill="#111827"/>'
                  )

              group.append("</g>")
              groups.append("".join(group))

          themes = [
              (
                  "github-contribution-grid-snake.svg",
                  "#ffffff", "#e5e7eb",
                  "#6d28d9", "#a78bfa", "#0891b2"
              ),
              (
                  "github-contribution-grid-snake-dark.svg",
                  "#0d1117", "#21262d",
                  "#f472b6", "#a855f7", "#22d3ee"
              ),
          ]

          out = Path("dist")
          out.mkdir(exist_ok=True)

          for filename, bg, grid, head, body, food in themes:
              theme = (
                  f"svg{{--head:{head};--body:{body};"
                  f"--food:{food}}}"
              )

              svg = [
                  '<svg xmlns="http://www.w3.org/2000/svg" '
                  f'viewBox="0 0 {width} {height}" '
                  'role="img" aria-label="Decorative growing snake animation">',
                  '<title>Growing Snake — 12 Dots</title>',
                  "<style>" + theme + "".join(css) + "</style>",
                  f'<rect width="{width}" height="{height}" '
                  f'rx="12" fill="{bg}"/>',
              ]

              for y in range(H):
                  for x in range(W):
                      svg.append(
                          f'<rect x="{x*CELL+3}" y="{y*CELL+3}" '
                          'width="14" height="14" rx="3" '
                          f'fill="{grid}"/>'
                      )

              svg.extend(groups)
              svg.append("</svg>")
              (out / filename).write_text("".join(svg))

              print(f"Created {filename}: {ROUNDS} rounds")

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
